name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sequoia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d sequoia_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sequoia_test
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            services/sequoia-ingest -> target
      - run: mise run verify

  iris:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: ['1.21.4', '1.21.11']
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          install: false
      - uses: gradle/actions/setup-gradle@v4
      - run: mise run iris:build "${{ matrix.profile }}"
