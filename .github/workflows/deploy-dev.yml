name: Deploy Dev

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy dev branch to Coolify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      COOLIFY_RESOURCE_UUID: ${{ secrets.COOLIFY_RESOURCE_UUID }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Deploy the dev pull-request environment
        shell: bash
        run: |
          set -euo pipefail

          for variable in COOLIFY_RESOURCE_UUID COOLIFY_TOKEN COOLIFY_WEBHOOK; do
            if [ -z "${!variable:-}" ]; then
              echo "Missing required secret: ${variable}"
              exit 1
            fi
          done

          pr_number="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --head dev \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [ -z "${pr_number}" ]; then
            echo "The dev branch needs an open pull request to create a Coolify preview environment."
            exit 1
          fi

          coolify_origin="${COOLIFY_WEBHOOK%%/api/v1/deploy*}"
          api_base="${coolify_origin}/api/v1"
          token_variable=COOLIFY_TOKEN
          auth_header="Authorization: Bearer ${!token_variable}"

          deploy_response="$(curl --proto '=https' --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            -X POST \
            -H "${auth_header}" \
            "${api_base}/deploy?uuid=${COOLIFY_RESOURCE_UUID}&pr=${pr_number}")"
          deployment_uuid="$(jq -r '.deployments[0].deployment_uuid // empty' <<<"${deploy_response}")"
          if [ -z "${deployment_uuid}" ]; then
            echo "Coolify accepted no preview deployment."
            exit 1
          fi

          echo "Pull request: ${pr_number}"
          echo "Deployment: ${deployment_uuid}"

          for attempt in $(seq 1 300); do
            response_file="$(mktemp)"
            status_code="$(curl --proto '=https' --silent --show-error \
              --connect-timeout 10 --max-time 60 \
              --output "${response_file}" --write-out '%{http_code}' \
              -H "${auth_header}" \
              "${api_base}/deployments/${deployment_uuid}")"

            if [ "${status_code}" = 403 ]; then
              echo "The deploy-scoped token cannot read deployment status; Coolify accepted the preview deployment."
              exit 0
            fi
            if [ "${status_code}" != 200 ]; then
              echo "Coolify deployment status request failed with HTTP ${status_code}."
              rm -f "${response_file}"
              exit 1
            fi

            deployment="$(<"${response_file}")"
            rm -f "${response_file}"
            status="$(jq -r '.status // "unknown"' <<<"${deployment}")"
            case "${status}" in
              finished)
                echo "Deployment finished successfully."
                jq '{status, deployment_uuid: .deployment_uuid, commit: .commit, created_at, finished_at}' \
                  <<<"${deployment}"
                exit 0
                ;;
              failed|cancelled)
                echo "Deployment ended with status: ${status}"
                jq '{status, deployment_uuid: .deployment_uuid, commit: .commit, created_at, finished_at}' \
                  <<<"${deployment}"
                exit 1
                ;;
            esac
            if [ $((attempt % 10)) -eq 0 ]; then
              echo "Deployment status: ${status}"
            fi
            sleep 15
          done

          echo "Timed out waiting for Coolify deployment ${deployment_uuid}."
          exit 1
