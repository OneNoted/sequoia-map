name: Deploy Dev

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Configure and deploy dev on Coolify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      COOLIFY_RESOURCE_UUID: ${{ secrets.COOLIFY_RESOURCE_UUID }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
    steps:
      - name: Configure and deploy the dev application
        shell: bash
        run: |
          set -euo pipefail

          for variable in COOLIFY_RESOURCE_UUID COOLIFY_TOKEN COOLIFY_WEBHOOK; do
            if [ -z "${!variable:-}" ]; then
              echo "Missing required secret: ${variable}"
              exit 1
            fi
          done

          coolify_origin="${COOLIFY_WEBHOOK%%/api/v1/deploy*}"
          api_base="${coolify_origin}/api/v1"
          token_variable=COOLIFY_TOKEN
          auth_header="Authorization: Bearer ${!token_variable}"
          dev_name=sequoia-map-dev
          dev_domain=https://dev.152-53-252-142.sslip.io

          api_get() {
            local path="$1"
            local output="$2"
            local status
            status="$(curl --proto '=https' --silent --show-error \
              --connect-timeout 10 --max-time 60 \
              --output "${output}" --write-out '%{http_code}' \
              -H "${auth_header}" "${api_base}${path}")"
            if [ "${status}" != 200 ]; then
              echo "Coolify GET ${path} failed with HTTP ${status}."
              return 1
            fi
          }

          production_file="$(mktemp)"
          applications_file="$(mktemp)"
          destinations_file="$(mktemp)"
          trap 'rm -f "${production_file}" "${applications_file}" "${destinations_file}"' EXIT

          api_get "/applications/${COOLIFY_RESOURCE_UUID}" "${production_file}"
          repository="$(jq -r '.git_repository // empty' "${production_file}")"
          if [[ "${repository,,}" != *"sequoiawynncraft/sequoia-map"* ]]; then
            echo "COOLIFY_RESOURCE_UUID does not identify the Sequoia map application."
            exit 1
          fi
          if [ "$(jq -r '.build_pack // empty' "${production_file}")" != dockercompose ]; then
            echo "The existing Sequoia map application is not a Docker Compose application."
            exit 1
          fi

          api_get /applications "${applications_file}"
          created=false
          dev_uuid="$(jq -r --arg name "${dev_name}" \
            '[.[] | select(.name == $name and .git_branch == "dev")][0].uuid // empty' \
            "${applications_file}")"

          if [ -z "${dev_uuid}" ]; then
            destination_id="$(jq -r '.destination_id // empty' "${production_file}")"
            api_get /destinations "${destinations_file}"
            destination_uuid="$(jq -r --argjson id "${destination_id}" \
              '[.[] | select(.id == $id)][0].uuid // empty' "${destinations_file}")"
            if [ -z "${destination_uuid}" ]; then
              echo "Could not resolve the production application's destination."
              exit 1
            fi

            clone_payload="$(jq -n \
              --arg destination_uuid "${destination_uuid}" \
              --arg name "${dev_name}" \
              '{destination_uuid: $destination_uuid, name: $name, clone_volumes: false}')"
            clone_file="$(mktemp)"
            clone_status="$(curl --proto '=https' --silent --show-error \
              --connect-timeout 10 --max-time 120 \
              --output "${clone_file}" --write-out '%{http_code}' \
              -X POST -H "${auth_header}" -H 'Content-Type: application/json' \
              --data "${clone_payload}" \
              "${api_base}/applications/${COOLIFY_RESOURCE_UUID}/clone")"
            if [ "${clone_status}" != 201 ]; then
              echo "Coolify application clone failed with HTTP ${clone_status}."
              jq '{message, errors}' "${clone_file}" 2>/dev/null || true
              rm -f "${clone_file}"
              exit 1
            fi
            dev_uuid="$(jq -r '.uuid // empty' "${clone_file}")"
            rm -f "${clone_file}"
            if [ -z "${dev_uuid}" ]; then
              echo "Coolify cloned the application without returning its UUID."
              exit 1
            fi
            created=true
            echo "Created Coolify application ${dev_name} (${dev_uuid})."
          else
            echo "Using existing Coolify application ${dev_name} (${dev_uuid})."
          fi

          update_payload="$(jq -n \
            --arg name "${dev_name}" \
            --arg domain "${dev_domain}" \
            '{
              name: $name,
              description: "Development deployment of SequoiaWynncraft/sequoia-map dev branch",
              git_branch: "dev",
              git_commit_sha: "",
              build_pack: "dockercompose",
              docker_compose_location: "/docker-compose.coolify.dev.yml",
              docker_compose_domains: [{name: "edge", domain: $domain}],
              noindex_domains: [$domain],
              is_auto_deploy_enabled: true,
              is_preview_deployments_enabled: false,
              health_check_enabled: true,
              health_check_path: "/api/health"
            }')"
          update_file="$(mktemp)"
          update_status="$(curl --proto '=https' --silent --show-error \
            --connect-timeout 10 --max-time 120 \
            --output "${update_file}" --write-out '%{http_code}' \
            -X PATCH -H "${auth_header}" -H 'Content-Type: application/json' \
            --data "${update_payload}" \
            "${api_base}/applications/${dev_uuid}")"
          if [ "${update_status}" != 200 ]; then
            echo "Coolify dev application update failed with HTTP ${update_status}."
            jq '{message, errors}' "${update_file}" 2>/dev/null || true
            rm -f "${update_file}"
            exit 1
          fi
          rm -f "${update_file}"

          if [ "${created}" = true ]; then
            postgres_password="$(openssl rand -hex 32)"
            ingest_token="$(openssl rand -hex 32)"
            env_payload="$(jq -n \
              --arg postgres_password "${postgres_password}" \
              --arg ingest_token "${ingest_token}" \
              --arg map_domain "${dev_domain#https://}" \
              '{data: [
                {key: "POSTGRES_PASSWORD", value: $postgres_password, is_preview: false, is_literal: true},
                {key: "INTERNAL_INGEST_TOKEN", value: $ingest_token, is_preview: false, is_literal: true},
                {key: "MAP_DOMAIN", value: $map_domain, is_preview: false, is_literal: true}
              ]}')"
            env_file="$(mktemp)"
            env_status="$(curl --proto '=https' --silent --show-error \
              --connect-timeout 10 --max-time 120 \
              --output "${env_file}" --write-out '%{http_code}' \
              -X PATCH -H "${auth_header}" -H 'Content-Type: application/json' \
              --data "${env_payload}" \
              "${api_base}/applications/${dev_uuid}/envs/bulk")"
            unset postgres_password ingest_token env_payload
            if [ "${env_status}" != 201 ]; then
              echo "Coolify dev environment configuration failed with HTTP ${env_status}."
              jq '{message, errors}' "${env_file}" 2>/dev/null || true
              rm -f "${env_file}"
              exit 1
            fi
            rm -f "${env_file}"
          fi

          deploy_file="$(mktemp)"
          deploy_status="$(curl --proto '=https' --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            --output "${deploy_file}" --write-out '%{http_code}' \
            -X POST -H "${auth_header}" \
            "${api_base}/deploy?uuid=${dev_uuid}&force=true")"
          if [ "${deploy_status}" != 200 ]; then
            echo "Coolify dev deployment request failed with HTTP ${deploy_status}."
            jq '{message, errors}' "${deploy_file}" 2>/dev/null || true
            rm -f "${deploy_file}"
            exit 1
          fi
          deployment_uuid="$(jq -r '.deployments[0].deployment_uuid // empty' "${deploy_file}")"
          if [ -z "${deployment_uuid}" ]; then
            echo "Coolify accepted no dev deployment."
            jq '{deployments: [.deployments[]? | {message, resource_uuid}]}' "${deploy_file}"
            rm -f "${deploy_file}"
            exit 1
          fi
          rm -f "${deploy_file}"

          echo "Dev resource: ${dev_uuid}"
          echo "Dev deployment: ${deployment_uuid}"
          echo "Dev URL: ${dev_domain}"

          for attempt in $(seq 1 300); do
            deployment_file="$(mktemp)"
            status_code="$(curl --proto '=https' --silent --show-error \
              --connect-timeout 10 --max-time 60 \
              --output "${deployment_file}" --write-out '%{http_code}' \
              -H "${auth_header}" \
              "${api_base}/deployments/${deployment_uuid}")"
            if [ "${status_code}" = 403 ]; then
              echo "The deploy-scoped token cannot read status; Coolify accepted the deployment."
              rm -f "${deployment_file}"
              exit 0
            fi
            if [ "${status_code}" != 200 ]; then
              echo "Coolify deployment status request failed with HTTP ${status_code}."
              rm -f "${deployment_file}"
              exit 1
            fi

            status="$(jq -r '.status // "unknown"' "${deployment_file}")"
            commit="$(jq -r '.commit // empty' "${deployment_file}")"
            rm -f "${deployment_file}"
            case "${status}" in
              finished)
                echo "Deployment finished successfully at commit ${commit}."
                exit 0
                ;;
              failed|cancelled)
                echo "Deployment ended with status ${status} at commit ${commit}."
                exit 1
                ;;
            esac
            if [ $((attempt % 10)) -eq 0 ]; then
              echo "Deployment status: ${status}"
            fi
            sleep 15
          done

          echo "Timed out waiting for Coolify deployment ${deployment_uuid}."
          exit 1
