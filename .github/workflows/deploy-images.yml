name: Deploy Images

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      release:
        description: "promote: build, promote and deploy main. build-only: build and push sha- candidates of the chosen ref; promote nothing and leave Coolify alone."
        type: choice
        options: [promote, build-only]
        default: promote

permissions:
  contents: read

# Only eligible production runs may occupy the shared deployment queue.
# Finish an active deployment; a replaced pending run is covered by the baseline diff.
concurrency:
  group: ${{ github.repository == 'OneNoted/sequoia-map' && github.ref == 'refs/heads/main' && 'deploy-images-production' || format('deploy-images-nonproduction-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/onenoted/sequoia-map-server
  INGEST_IMAGE: ghcr.io/onenoted/sequoia-map-ingest
  EDGE_IMAGE: ghcr.io/onenoted/sequoia-map-edge

jobs:
  changes:
    # A build-only run may build any ref's candidates; only main is ever promoted.
    if: github.repository == 'OneNoted/sequoia-map' && (github.ref == 'refs/heads/main' || inputs.release == 'build-only')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
      ingest: ${{ steps.filter.outputs.ingest }}
      edge: ${{ steps.filter.outputs.edge }}
      deploy: ${{ steps.filter.outputs.deploy }}
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          else
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
          git fetch --no-tags --prune origin "+${GITHUB_REF}:refs/remotes/origin/workflow-checkout"
          git checkout --force "${GITHUB_SHA}"
          git clean -ffdx

      - name: Detect Deploy-Relevant Changes
        id: filter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AFTER_SHA: ${{ github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          emit_selection() {
            local server="$1" ingest="$2" edge="$3" deploy=false matrix
            for selected in "${server}" "${ingest}" "${edge}"; do
              case "${selected}" in
                true) deploy=true ;;
                false) ;;
                *) echo "Invalid image selection: ${selected}" >&2; exit 1 ;;
              esac
            done
            matrix="$(jq -cn --argjson server "${server}" --argjson ingest "${ingest}" --argjson edge "${edge}" \
              '{image: [if $server then "server" else empty end, if $ingest then "ingest" else empty end, if $edge then "edge" else empty end]}')"
            {
              echo "server=${server}"
              echo "ingest=${ingest}"
              echo "edge=${edge}"
              echo "deploy=${deploy}"
              echo "matrix=${matrix}"
            } >> "${GITHUB_OUTPUT}"
          }

          emit_all() {
            echo "Building all images: no reliable deployment baseline or input closure."
            emit_selection true true true
          }

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            emit_all
            exit 0
          fi

          # A failed run may have promoted tags before failing its trigger/readback.
          # Scan all statuses until an actual publication+trigger; uncertainty rebuilds all.
          if ! recent_runs="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-images.yml/runs" \
            -f branch=main -F per_page=20 --jq '.workflow_runs[] | [.id, .head_sha, (.conclusion // "pending")] | @tsv')"; then
            emit_all
            exit 0
          fi
          before=""
          while IFS=$'\t' read -r run_id run_sha conclusion; do
            if ! [[ "${run_id}" =~ ^[0-9]+$ && "${run_sha}" =~ ^[0-9a-f]{40}$ ]]; then
              emit_all
              exit 0
            fi
            if [ "${run_id}" = "${CURRENT_RUN_ID}" ]; then
              continue
            fi
            if [ "${conclusion}" != success ]; then
              emit_all
              exit 0
            fi
            if ! published="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
              -f filter=latest -F per_page=100 \
              --jq 'if .total_count != (.jobs | length) then error("Incomplete workflow job list") else [.jobs[] | select(.name == "Promote Images And Trigger Coolify" or .name == "Publish Images And Trigger Coolify")] | length == 1 and .[0].conclusion == "success" end')"; then
              emit_all
              exit 0
            fi
            case "${published}" in
              true) before="${run_sha}"; break ;;
              false) ;;
              *) emit_all; exit 0 ;;
            esac
          done <<< "${recent_runs}"
          if [ -z "${before}" ]; then
            emit_all
            exit 0
          fi
          if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            if ! git fetch --no-tags origin "${before}"; then
              emit_all
              exit 0
            fi
          fi
          if ! git merge-base --is-ancestor "${before}" "${AFTER_SHA}"; then
            emit_all
            exit 0
          fi
          # scripts/release.py owns the input closure; release:plan reports the same plan.
          if ! plan="$(python3 scripts/release.py plan --base "${before}" --head "${AFTER_SHA}")"; then
            emit_all
            exit 0
          fi
          echo "Selecting image changes since successful workflow head ${before}."
          jq -c '{paths: (.paths | length), unknown, client_release, images, static_release_suffices}' <<< "${plan}"
          if [ "$(jq -r '.client_release == "css" and .static_release_suffices' <<< "${plan}")" = true ]; then
            # The promotion job does not run, so the baseline stays here and the next
            # image-building change also rebuilds the server with this stylesheet.
            echo "::notice title=Stylesheet-only change::Nothing is rebuilt or restarted. Publish it with 'mise run release:client -- --from-target' and 'mise run release:activate'."
            emit_selection false false false
            exit 0
          fi
          selected() { jq -r --arg image "$1" '.images | index($image) != null' <<< "${plan}"; }
          emit_selection "$(selected server)" "$(selected ingest)" "$(selected edge)"

      - name: Describe A Build-Only Run
        if: inputs.release == 'build-only'
        shell: bash
        env:
          MATRIX_JSON: ${{ steps.filter.outputs.matrix }}
        run: |
          set -euo pipefail
          images="$(jq -r '.image | join(", ")' <<< "${MATRIX_JSON}")"
          echo "::notice title=Build-only run::Builds and pushes ${images} as sha-${GITHUB_SHA} candidates. No main tag is promoted and Coolify is not called, so this run never becomes a promotion baseline."

      - name: Validate Image Selection
        shell: bash
        env:
          SERVER_SELECTED: ${{ steps.filter.outputs.server }}
          INGEST_SELECTED: ${{ steps.filter.outputs.ingest }}
          EDGE_SELECTED: ${{ steps.filter.outputs.edge }}
          DEPLOY_SELECTED: ${{ steps.filter.outputs.deploy }}
          MATRIX_JSON: ${{ steps.filter.outputs.matrix }}
        run: |
          set -euo pipefail
          for selected in "${SERVER_SELECTED}" "${INGEST_SELECTED}" "${EDGE_SELECTED}" "${DEPLOY_SELECTED}"; do
            case "${selected}" in
              true|false) ;;
              *) echo "Missing or invalid deployment selection." >&2; exit 1 ;;
            esac
          done
          jq -e --argjson server "${SERVER_SELECTED}" --argjson ingest "${INGEST_SELECTED}" --argjson edge "${EDGE_SELECTED}" \
            --argjson deploy "${DEPLOY_SELECTED}" \
            '. == {image: [if $server then "server" else empty end, if $ingest then "ingest" else empty end, if $edge then "edge" else empty end]} and ((.image | length > 0) == $deploy)' \
            <<< "${MATRIX_JSON}" >/dev/null

  credentials:
    name: Validate Deployment Credentials
    needs: changes
    if: needs.changes.outputs.deploy == 'true' && inputs.release != 'build-only'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate Coolify Deploy Credentials
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
        run: |
          if [ -z "${COOLIFY_WEBHOOK:-}" ]; then
            echo "Missing required secret: COOLIFY_WEBHOOK"
            exit 1
          fi
          if [ -z "${COOLIFY_TOKEN:-}" ]; then
            echo "Missing required secret: COOLIFY_TOKEN"
            exit 1
          fi

          COOLIFY_API_BASE="${COOLIFY_WEBHOOK%%/api/v1/deploy*}"
          PROBE_URL="${COOLIFY_API_BASE}/api/v1/deploy?uuid=auth-probe-missing-resource"
          PROBE_STATUS="$(curl --proto '=https' --tlsv1.2 --silent --show-error --connect-timeout 10 --max-time 30 --output /tmp/coolify-probe.json --write-out '%{http_code}' \
            --request POST \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${PROBE_URL}")"

          if [ "${PROBE_STATUS}" != "404" ]; then
            echo "Coolify deploy credential probe failed with status ${PROBE_STATUS}."
            cat /tmp/coolify-probe.json
            exit 1
          fi


  build-images:
    name: Build ${{ matrix.image }} Image
    needs: [changes, credentials]
    # A build-only run skips the Coolify credential probe; every other run needs it.
    if: >-
      always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.deploy == 'true'
      && (needs.credentials.result == 'success' || (inputs.release == 'build-only' && needs.credentials.result == 'skipped'))
    # The server image compiles the release API and both WASM clients; ingest and edge are small.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          else
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
          git fetch --no-tags --prune origin "+${GITHUB_REF}:refs/remotes/origin/workflow-checkout"
          git checkout --force "${GITHUB_SHA}"
          git clean -ffdx

      - name: Set Up Buildx
        shell: bash
        run: |
          set -euo pipefail
          docker buildx create --name sequoia-builder --use || docker buildx use sequoia-builder
          docker buildx inspect --bootstrap

      - name: Log In To GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" | docker login "${REGISTRY}" -u "${GITHUB_ACTOR}" --password-stdin

      - name: Prepare Client Build Tool Archives
        if: matrix.image == 'server'
        env:
          TAILWINDCSS_VERSION: 4.2.0
          TAILWINDCSS_LINUX_X64_SHA256: 8f65e2d21c675f1e8d265219979d17d10634c1f553a2f583265b7edb28726432
          WASM_BINDGEN_VERSION: 0.2.113
          WASM_BINDGEN_X64_MUSL_SHA256: 0366bf5936d5e2578b06fc318a5696ddecfb66382e671e51f469b83f3494712f
        run: |
          mkdir -p .ci/binaryen
          mkdir -p .ci/tailwindcss
          mkdir -p .ci/wasm-bindgen
          curl --proto '=https' --tlsv1.2 --http1.1 --retry 8 --retry-delay 2 --retry-all-errors --connect-timeout 20 --max-time 120 --speed-limit 1024 --speed-time 30 -fsSLo .ci/binaryen/binaryen.tar.gz \
            https://github.com/WebAssembly/binaryen/releases/download/version_126/binaryen-version_126-x86_64-linux.tar.gz
          curl --proto '=https' --tlsv1.2 --http1.1 --retry 8 --retry-delay 2 --retry-all-errors --connect-timeout 20 --max-time 60 -fsSLo .ci/binaryen/binaryen.tar.gz.sha256 \
            https://github.com/WebAssembly/binaryen/releases/download/version_126/binaryen-version_126-x86_64-linux.tar.gz.sha256
          EXPECTED_SHA="$(awk '{print $1}' .ci/binaryen/binaryen.tar.gz.sha256)"
          echo "${EXPECTED_SHA}  .ci/binaryen/binaryen.tar.gz" | sha256sum -c -
          curl --proto '=https' --tlsv1.2 --http1.1 --retry 8 --retry-delay 2 --retry-all-errors --connect-timeout 20 --max-time 120 --speed-limit 1024 --speed-time 30 -fsSLo .ci/tailwindcss/tailwindcss \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/v${TAILWINDCSS_VERSION}/tailwindcss-linux-x64"
          echo "${TAILWINDCSS_LINUX_X64_SHA256}" > .ci/tailwindcss/tailwindcss.sha256
          echo "${TAILWINDCSS_LINUX_X64_SHA256}  .ci/tailwindcss/tailwindcss" | sha256sum -c -
          curl --proto '=https' --tlsv1.2 --http1.1 --retry 8 --retry-delay 2 --retry-all-errors --connect-timeout 20 --max-time 120 --speed-limit 1024 --speed-time 30 -fsSLo .ci/wasm-bindgen/wasm-bindgen.tar.gz \
            "https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${WASM_BINDGEN_X64_MUSL_SHA256}" > .ci/wasm-bindgen/wasm-bindgen.tar.gz.sha256
          echo "${WASM_BINDGEN_X64_MUSL_SHA256}  .ci/wasm-bindgen/wasm-bindgen.tar.gz" | sha256sum -c -

      - name: Build And Push Candidate Image
        shell: bash
        env:
          IMAGE_KIND: ${{ matrix.image }}
        run: |
          set -euo pipefail
          build_args=()
          case "${IMAGE_KIND}" in
            server)
              image="${SERVER_IMAGE}"
              dockerfile=./Dockerfile
              # The Dockerfile's two Cargo jobs per concurrent native and WASM stage fit the
              # 4-vCPU standard runner. A fixed value keeps the dependency layers' cache key
              # stable across runner sizes.
              build_args+=(--build-arg "SOURCE_COMMIT=${GITHUB_SHA}") ;;
            ingest)
              image="${INGEST_IMAGE}"
              dockerfile=./services/sequoia-ingest/Dockerfile ;;
            edge)
              image="${EDGE_IMAGE}"
              dockerfile=./ops/caddy/Dockerfile.coolify ;;
            *) echo "Unknown image kind: ${IMAGE_KIND}" >&2; exit 1 ;;
          esac
          docker buildx build \
            --platform linux/amd64 \
            --file "${dockerfile}" \
            "${build_args[@]}" \
            --tag "${image}:sha-${GITHUB_SHA}" \
            --cache-from "type=registry,ref=${image}:buildcache" \
            --cache-to "type=registry,ref=${image}:buildcache,mode=max" \
            --provenance=false \
            --sbom=false \
            --push \
            .

      - name: Install The Size Check Tools
        if: matrix.image == 'server'
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.17
          install_args: python uv
          cache: false

      # A promoted image must hold a map client within its compressed size budget, and the
      # backend key that static client releases are checked against must be this commit's.
      - name: Check The Published Server Image
        if: matrix.image == 'server'
        env:
          UV_PYTHON_DOWNLOADS: never
        shell: bash
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${SERVER_IMAGE}:sha-${GITHUB_SHA}" --format '{{json .Manifest}}' \
            | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))')"
          docker pull --quiet "${SERVER_IMAGE}@${digest}" >/dev/null
          container="$(docker create "${SERVER_IMAGE}@${digest}")"
          rm -rf client/dist
          docker cp "${container}:/app/client/dist" client/dist
          docker cp "${container}:/app/backend-key" "${RUNNER_TEMP}/backend-key"
          docker rm "${container}" >/dev/null
          image_key="$(tr -d '[:space:]' < "${RUNNER_TEMP}/backend-key")"
          source_key="$(python3 scripts/release.py key --commit "${GITHUB_SHA}")"
          if [ "${image_key}" != "${source_key}" ]; then
            echo "::error title=Backend key mismatch::The image records ${image_key}; scripts/release.py computes ${source_key} for ${GITHUB_SHA}." >&2
            exit 1
          fi
          echo "Backend key ${image_key} matches the source."
          uv run --script scripts/check-wasm-size.py

  publish-and-deploy:
    name: Promote Images And Trigger Coolify
    needs: [changes, credentials, build-images]
    # Missing selections or failed prerequisites must produce a failed promotion gate. A
    # build-only run never gets here, so it is never a promotion baseline for later runs.
    if: always() && !cancelled() && inputs.release != 'build-only' && github.repository == 'OneNoted/sequoia-map' && github.ref == 'refs/heads/main' && (needs.changes.result != 'success' || needs.changes.outputs.deploy != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Require Successful Selected Builds
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CREDENTIALS_RESULT: ${{ needs.credentials.result }}
          BUILDS_RESULT: ${{ needs.build-images.result }}
          SERVER_SELECTED: ${{ needs.changes.outputs.server }}
          INGEST_SELECTED: ${{ needs.changes.outputs.ingest }}
          EDGE_SELECTED: ${{ needs.changes.outputs.edge }}
          DEPLOY_SELECTED: ${{ needs.changes.outputs.deploy }}
          MATRIX_JSON: ${{ needs.changes.outputs.matrix }}
        run: |
          set -euo pipefail
          if [ "${CHANGES_RESULT}" != success ] || [ "${CREDENTIALS_RESULT}" != success ] || [ "${BUILDS_RESULT}" != success ]; then
            echo "Deployment prerequisites were not all successful." >&2
            exit 1
          fi
          if [ "${DEPLOY_SELECTED}" != true ]; then
            echo "Missing or invalid deployment selection." >&2
            exit 1
          fi
          for selected in "${SERVER_SELECTED}" "${INGEST_SELECTED}" "${EDGE_SELECTED}"; do
            case "${selected}" in
              true|false) ;;
              *) echo "Missing or invalid image selection." >&2; exit 1 ;;
            esac
          done
          jq -e --argjson server "${SERVER_SELECTED}" --argjson ingest "${INGEST_SELECTED}" --argjson edge "${EDGE_SELECTED}" \
            '. == {image: [if $server then "server" else empty end, if $ingest then "ingest" else empty end, if $edge then "edge" else empty end]} and (.image | length > 0)' \
            <<< "${MATRIX_JSON}" >/dev/null

      - name: Log In To GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" | docker login "${REGISTRY}" -u "${GITHUB_ACTOR}" --password-stdin

      - name: Resolve And Promote Current Main Candidate
        shell: bash
        env:
          SERVER_SELECTED: ${{ needs.changes.outputs.server }}
          INGEST_SELECTED: ${{ needs.changes.outputs.ingest }}
          EDGE_SELECTED: ${{ needs.changes.outputs.edge }}
        run: |
          set -euo pipefail
          images=()
          digests=()
          for kind in server ingest edge; do
            case "${kind}" in
              server) selected="${SERVER_SELECTED}"; image="${SERVER_IMAGE}" ;;
              ingest) selected="${INGEST_SELECTED}"; image="${INGEST_IMAGE}" ;;
              edge) selected="${EDGE_SELECTED}"; image="${EDGE_IMAGE}" ;;
            esac
            if [ "${selected}" = true ]; then
              digest="$(docker buildx imagetools inspect "${image}:sha-${GITHUB_SHA}" --format '{{json .Manifest}}' \
                | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))')"
              images+=("${image}")
              digests+=("${digest}")
            fi
          done

          # Resolve every selected image before any mutable production tag changes.
          # A rejected old candidate remains failed, never becoming a new diff baseline.
          current_head="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          if [ "${current_head}" != "${GITHUB_SHA}" ]; then
            echo "Refusing superseded candidate ${GITHUB_SHA}; main is ${current_head}." >&2
            exit 1
          fi
          for index in "${!images[@]}"; do
            image="${images[index]}"
            digest="${digests[index]}"
            docker buildx imagetools create --prefer-index=false --tag "${image}:main" "${image}@${digest}"
            promoted_digest="$(docker buildx imagetools inspect "${image}:main" --format '{{json .Manifest}}' \
              | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))')"
            if [ "${promoted_digest}" != "${digest}" ]; then
              echo "Production tag readback did not match candidate digest for ${image}." >&2
              exit 1
            fi
          done

      - name: Trigger Coolify Deploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
        run: |
          if [ -z "${COOLIFY_WEBHOOK:-}" ]; then
            echo "Missing required secret: COOLIFY_WEBHOOK"
            exit 1
          fi
          if [ -z "${COOLIFY_TOKEN:-}" ]; then
            echo "Missing required secret: COOLIFY_TOKEN"
            exit 1
          fi

          # Narrow the promotion-to-trigger window; Git and HTTP are not atomic.
          current_head="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main)" || exit 1
          [ "${current_head}" = "${GITHUB_SHA}"$'\trefs/heads/main' ] || { echo "Refusing trigger: candidate is superseded or main is unknown." >&2; exit 1; }
          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error --connect-timeout 10 --max-time 60 \
            --request POST \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_WEBHOOK}"
