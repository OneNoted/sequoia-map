[workspace]
members = ["shared", "server", "wasm", "browser-map", "client", "claims-client"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }

# No debug info for this workspace's crates in dev, whichever entry point builds, so plain
# Cargo and Mise share artifacts. Dependencies keep Cargo's own dev setting (line tables).
[profile.dev]
debug = 0

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release.package."*"]
opt-level = "s"

[profile.release.package."sequoia-client"]
opt-level = 3

[profile.release.package."sequoia-claims-client"]
opt-level = 3

[profile.release.package."sequoia-browser-map"]
opt-level = 3

[profile.release.package."sequoia-server"]
opt-level = 3

[profile.release.package."sequoia-shared"]
opt-level = 3

[profile.dev.package."sequoia-client"]
opt-level = 1
debug = 0

[profile.dev.package."sequoia-claims-client"]
opt-level = 1
debug = 0

[profile.dev.package."sequoia-browser-map"]
opt-level = 1
debug = 0

[profile.release.package."sequoia-map-engine"]
opt-level = 3

[profile.dev.package."sequoia-map-engine"]
opt-level = 1
debug = 0

# The map image renderer decodes, resamples, draws and encodes megapixel images; keep those
# crates fast in tests and in the size-optimised release dependency profile.
[profile.dev.package.fast_image_resize]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.libwebp-sys]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.tiny-skia]
opt-level = 3

[profile.dev.package.tiny-skia-path]
opt-level = 3

[profile.release.package.fast_image_resize]
opt-level = 3

[profile.release.package.image-webp]
opt-level = 3

[profile.release.package.libwebp-sys]
opt-level = 3

[profile.release.package.png]
opt-level = 3

[profile.release.package.tiny-skia]
opt-level = 3

[profile.release.package.tiny-skia-path]
opt-level = 3
