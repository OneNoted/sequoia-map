[package]
name = "sequoia-browser-map"
edition.workspace = true
version.workspace = true

[dependencies]
sequoia-shared = { path = "../shared" }
sequoia-map-engine = { path = "../wasm" }
leptos = { version = "0.8.17", default-features = false, features = ["csr"] }
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "Document",
    "DomRect",
    "Element",
    "EventSource",
    "HtmlCanvasElement",
    "HtmlImageElement",
    "ImageData",
    "MessageEvent",
    "MouseEvent",
    "Navigator",
    "PointerEvent",
    "TextMetrics",
    "WheelEvent",
    "Window",
] }
wgpu = { version = "24.0", default-features = false, features = ["wgsl", "webgl"] }
bytemuck = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
futures = "0.3"
js-sys = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
gloo-net = "0.6"
