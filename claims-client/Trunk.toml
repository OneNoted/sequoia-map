[build]
target = "index.html"
dist = "dist"
locked = true
public_url = "/claims-app/"

[serve]
addresses = ["127.0.0.1"]
port = 8082
# Axum serves the route HTML, so Trunk cannot substitute its reload placeholders.
no_autoreload = true

[watch]
watch = ["src", "../client/src", "../shared/src", "../wasm/src", "../Cargo.toml", "../Cargo.lock", "index.html", "input.css", "public"]

[[proxy]]
backend = "http://127.0.0.1:3000/api/"
rewrite = "/api/"

# Route HTML comes from Axum; Trunk serves its /claims-app/ assets.
[[proxy]]
backend = "http://127.0.0.1:3000/claims"
rewrite = "/claims"
