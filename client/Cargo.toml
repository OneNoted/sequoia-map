[package]
name = "sequoia-client"
edition.workspace = true
version.workspace = true

[dependencies]
sequoia-shared = { path = "../shared" }
sequoia-map-engine = { path = "../wasm" }
sequoia-browser-map = { path = "../browser-map" }
leptos = { version = "0.8.17", default-features = false, features = ["csr"] }
leptos_router = { version = "0.8.12", default-features = false }
web-sys = { version = "0.3", features = [
    "AbortController",
    "AbortSignal",
    "Blob",
    "Clipboard",
    "Document",
    "CanvasRenderingContext2d",
    "DomRect",
    "File",
    "FileList",
    "HtmlElement",
    "HtmlInputElement",
    "Location",
    "Navigator",
    "PageTransitionEvent",
    "TextMetrics",
    "Window",
] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
futures = "0.3"
js-sys = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"
gloo-net = "0.6"
gloo-storage = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1"
chrono = { workspace = true }
