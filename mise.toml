[tools]
rust = { version = "1.96.1", profile = "minimal", components = [
  "clippy",
  "rustfmt",
], targets = [
  "wasm32-unknown-unknown",
] }
# Native TLS uses the maintained OS trust store, not an old prebuilt verifier.
"cargo:trunk" = { version = "0.22.0", default-features = false, features = ["native-tls"] }
"aqua:tailwindlabs/tailwindcss" = "4.2.0"
"aqua:WebAssembly/binaryen" = "126"
watchexec = "2.7.2"
python = "3.13.17"
uv = "0.13.5"
actionlint = "1.7.12"
shellcheck = "0.11.0"
zizmor = "1.31.1"

[env]
NO_COLOR = "true"
CARGO_PROFILE_DEV_DEBUG = "0"

[tasks.default]
description = "List development tasks"
run = "mise tasks"

[tasks."db:start"]
description = "Start persistent, loopback-only PostgreSQL in rootless Podman"
run = "bash scripts/postgres.sh start"

[tasks."db:stop"]
description = "Stop local PostgreSQL (keep its data)"
run = "bash scripts/postgres.sh stop"

[tasks."db:status"]
description = "Check local PostgreSQL readiness"
run = "bash scripts/postgres.sh status"

[tasks."db:url"]
description = "Print the local development DATABASE_URL"
run = "bash scripts/postgres.sh url"

[tasks.server]
description = "Watch and run the API on 127.0.0.1:3000"
env.SEQUOIA_SERVER_BIND = "127.0.0.1:3000"
env.MAP_DOMAIN = "http://127.0.0.1:8081"
env.INTERNAL_INGEST_TOKEN = "{{env.INTERNAL_INGEST_TOKEN | default(value='local-sequoia-internal-token-1234567890')}}"
run = '''
set -eu
if [ -z "${DATABASE_URL:-}" ]; then
  mise run db:start
  DATABASE_URL="$(bash scripts/postgres.sh url)"
  export DATABASE_URL
fi
watchexec --restart --watch server --watch shared --watch Cargo.toml --watch Cargo.lock -- cargo run --locked -p sequoia-server
'''

[tasks.client]
description = "Watch and serve the map on http://127.0.0.1:8081"
dir = "client"
run = "trunk serve"

[tasks.claims]
description = "Watch and serve claims on http://127.0.0.1:8082/claims/new/blank"
dir = "claims-client"
run = "trunk serve"

[tasks.ingest]
description = "Watch and run the Iris gateway on 127.0.0.1:3010"
env.SEQUOIA_INGEST_BIND = "127.0.0.1:3010"
env.SEQUOIA_INTERNAL_INGEST_TOKEN = "{{env.INTERNAL_INGEST_TOKEN | default(value='local-sequoia-internal-token-1234567890')}}"
env.SEQUOIA_INGEST_DB_URL = "sqlite://{{config_root}}/.data/sequoia-ingest.db?mode=rwc"
run = '''
set -eu
mkdir -p .data
watchexec --restart --watch services/sequoia-ingest/src --watch services/sequoia-ingest/Cargo.toml --watch services/sequoia-ingest/Cargo.lock --watch shared -- cargo run --locked --manifest-path services/sequoia-ingest/Cargo.toml
'''

[tasks.dev]
description = "Run map and API with hot reload"
run = "mise run --jobs 2 server ::: client"

[tasks."dev:full"]
description = "Run map, claims, API and Iris gateway with hot reload"
run = "mise run --jobs 4 server ::: client ::: claims ::: ingest"

[tasks.fmt]
description = "Format both Rust workspaces"
run = [
  "cargo fmt --all",
  "cargo fmt --manifest-path services/sequoia-ingest/Cargo.toml",
]

[tasks."fmt:check"]
description = "Check Rust formatting"
run = [
  "cargo fmt --all --check",
  "cargo fmt --manifest-path services/sequoia-ingest/Cargo.toml --check",
]

[tasks.check]
description = "Check all native crates and both browser targets"
run = [
  "cargo check --locked --workspace --all-targets",
  "cargo check --locked -p sequoia-client -p sequoia-claims-client -p sequoia-browser-map --target wasm32-unknown-unknown",
  "cargo check --locked --manifest-path services/sequoia-ingest/Cargo.toml --all-targets",
]

[tasks.lint]
description = "Run Clippy for native crates and browser targets"
run = [
  "cargo clippy --locked --workspace --all-targets -- -D warnings",
  "cargo clippy --locked -p sequoia-client -p sequoia-claims-client -p sequoia-browser-map --target wasm32-unknown-unknown -- -D warnings",
  "cargo clippy --locked --manifest-path services/sequoia-ingest/Cargo.toml --all-targets -- -D warnings",
]

# The server's tests are the ones that use PostgreSQL; hosted CI runs only these.
[tasks."test:db"]
description = "Run the server tests with a separate PostgreSQL test database"
run = '''
set -eu
DATABASE_URL="${TEST_DATABASE_URL:-$(bash scripts/postgres.sh test-url)}"
export DATABASE_URL
cargo test --locked -p sequoia-server
'''

[tasks.test]
description = "Run every Rust test, the server's with a separate PostgreSQL test database"
run = [
  { task = "test:db" },
  "cargo test --locked --workspace --exclude sequoia-server",
  "cargo test --locked --manifest-path services/sequoia-ingest/Cargo.toml",
]

[tasks."build:client"]
description = "Build the release map client"
dir = "client"
run = "trunk build --release --locked"

[tasks."build:claims"]
description = "Build the release claims client"
dir = "claims-client"
run = "trunk build --release --locked"

[tasks."build:server"]
description = "Build the release API server"
run = "cargo build --release --locked -p sequoia-server"

[tasks."build:ingest"]
description = "Build the release Iris gateway"
run = "cargo build --release --locked --manifest-path services/sequoia-ingest/Cargo.toml"

[tasks."size:client"]
description = "Check compressed release WASM against the client size budget"
depends = ["build:client"]
run = "uv run --script scripts/check-wasm-size.py"

[tasks."release:plan"]
description = "Say what delivering a change needs: a CSS or client release, images or config"
run = "uv run --script scripts/release.py plan"

[tasks."release:client"]
description = "Build a client release bundle, reusing the base release when only CSS changed"
run = "uv run --script scripts/release.py client"

[tasks."release:activate"]
description = "Install, activate and check a client release bundle on SEQUOIA_RELEASE_EXEC"
run = "uv run --script scripts/release.py activate"

[tasks."release:status"]
description = "Show the target's client releases"
run = "uv run --script scripts/release.py status"

[tasks."release:rollback"]
description = "Activate the target's previous client release"
run = "uv run --script scripts/release.py rollback"

[tasks."release:services"]
description = "Pull and update only the named service images through SEQUOIA_COMPOSE_EXEC"
run = "uv run --script scripts/release.py services"

[tasks."test:release"]
description = "Test release selection, the backend key and the CSS-only release path"
run = "uv run --script scripts/test-release.py"

[tasks."lint:ci"]
description = "Lint the workflows and CI scripts"
run = [
  "actionlint",
  "shellcheck scripts/ci-lane.sh scripts/test-ci-lane.sh",
  "zizmor --offline --no-progress .github/workflows",
]

[tasks."test:ci"]
description = "Test the hosted CI lane selection"
run = "bash scripts/test-ci-lane.sh"

[tasks.ci]
description = "Run the hosted CI checks: formatting, Clippy and the PostgreSQL tests"
run = [
  { task = "fmt:check" },
  { task = "lint" },
  { task = "test:db" },
]

[tasks.verify]
description = "Run every check: formatting, Clippy, all tests, CI selection, release builds and size budget"
run = [
  { task = "lint:ci" },
  { task = "test:ci" },
  { task = "test:release" },
  { task = "fmt:check" },
  { task = "lint" },
  { task = "test" },
  { task = "size:client" },
  { task = "build:claims" },
]

[tasks."smoke:install"]
description = "Install Chromium for the browser smoke test"
run = "uv run --script scripts/smoke-browser.py --install"

[tasks.smoke]
description = "Smoke-test the running dev:full stack in Chromium"
run = "uv run --script scripts/smoke-browser.py"
