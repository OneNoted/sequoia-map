min_version = "2026.10.17"

[settings]
# Mise daemons supervise the local stack.
experimental = true
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "macos-x64"]

[tools]
rust = { version = "1.96.1", profile = "minimal", components = [
  "clippy",
  "rustfmt",
], targets = [
  "wasm32-unknown-unknown",
] }
"aqua:tailwindlabs/tailwindcss" = "4.2.0"
"aqua:WebAssembly/binaryen" = "126"
"github:theseus-rs/postgresql-binaries" = "18.3.1"
"aqua:jdx/pitchfork" = "2.32.3"
"aqua:mozilla/sccache" = "0.19.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
zizmor = "1.31.1"
opentofu = "1.13.2"

[env]
NO_COLOR = "true"
# Registry dependencies compile once per machine and are shared by every worktree's own
# target; first-party crates stay incremental per worktree. Hosted CI restores its own cache.
RUSTC_WRAPPER = "{% if env.CI is undefined %}sccache{% endif %}"
INTERNAL_INGEST_TOKEN = "{{ env.INTERNAL_INGEST_TOKEN | default(value='local-sequoia-internal-token-1234567890') }}"

# Each worktree gets its own daemons, ports and `.data`.
[daemons.postgres]
preset = "postgres"
version = "18.3.1"
tool = "github:theseus-rs/postgresql-binaries"
port = { auto = true, base = 15432 }
data_dir = ".data/postgres"
options.database = "sequoia"

[daemons.api]
# Dev builds live apart from release builds (tools/xtask/src/web.rs DEV_ROOT).
run = "SEQUOIA_CLIENT_ROOT=.data/dev-web SEQUOIA_SERVER_BIND=127.0.0.1:$API_PORT MAP_DOMAIN=http://127.0.0.1:$API_PORT exec target/debug/sequoia-server"
port = { auto = true, base = 3000 }
proxy = false
depends = ["postgres"]
ready_cmd = "curl -sf -o /dev/null http://127.0.0.1:$API_PORT/api/health"

[daemons.watch]
run = "exec cargo xtask watch"
port = { auto = true, base = 3900 }
proxy = false
ready_output = "pages ready"

[daemons.ingest]
run = "SEQUOIA_INGEST_BIND=127.0.0.1:$INGEST_PORT SEQUOIA_SERVER_URL=http://127.0.0.1:$API_PORT SEQUOIA_INTERNAL_INGEST_TOKEN=$INTERNAL_INGEST_TOKEN SEQUOIA_INGEST_DB_URL=sqlite://$PWD/.data/sequoia-ingest.db?mode=rwc exec services/sequoia-ingest/target/debug/sequoia-ingest"
port = { auto = true, base = 3010 }
proxy = false
depends = ["api"]
ready_cmd = "curl -sf -o /dev/null http://127.0.0.1:$INGEST_PORT/health"

[daemon_groups]
default = ["postgres", "api", "watch"]
full = ["default", "ingest"]

[tasks.default]
description = "List development tasks"
run = "mise tasks"

[tasks.dev]
description = "Start PostgreSQL, the API and the rebuild-and-reload watcher; print the URLs"
run = [
  "cargo build --locked -p sequoia-server",
  "mise daemons start",
  "mise daemons urls",
]

[tasks."dev:full"]
description = "Start the dev stack and the Iris gateway"
run = [
  "cargo build --locked -p sequoia-server",
  "cargo build --locked --manifest-path services/sequoia-ingest/Cargo.toml",
  "mkdir -p .data",
  "mise daemons start full",
  "mise daemons urls",
]

[tasks.stop]
description = "Stop this worktree's daemons, keeping their data"
run = "mise daemons stop"

[tasks.logs]
description = "Follow the daemons' output"
run = "mise daemons logs --follow"

[tasks.psql]
description = "Open psql on the development database"
raw = true
run = "psql"

[tasks.fmt]
description = "Format every Rust workspace"
run = [
  "cargo fmt --all",
  "cargo fmt --manifest-path services/sequoia-ingest/Cargo.toml",
  "cargo fmt --manifest-path tools/xtask/Cargo.toml",
]

[tasks."fmt:check"]
description = "Check Rust formatting"
run = [
  "cargo fmt --all --check",
  "cargo fmt --manifest-path services/sequoia-ingest/Cargo.toml --check",
  "cargo fmt --manifest-path tools/xtask/Cargo.toml --check",
]

[tasks.lint]
description = "Run Clippy for native crates, both browser targets, the gateway and the tool"
run = [
  "cargo clippy --locked --workspace --all-targets -- -D warnings",
  "cargo clippy --locked -p sequoia-client -p sequoia-claims-client -p sequoia-browser-map --target wasm32-unknown-unknown -- -D warnings",
  "cargo clippy --locked --manifest-path services/sequoia-ingest/Cargo.toml --all-targets -- -D warnings",
  { task = "lint:tools" },
]

[tasks."lint:tools"]
description = "Run Clippy for the repository tool"
run = "cargo clippy --locked --manifest-path tools/xtask/Cargo.toml --all-targets -- -D warnings"

# Some server tests truncate tables. They read TEST_DATABASE_URL, never DATABASE_URL; without
# one this task recreates `sequoia_test` in the worktree's PostgreSQL for each run.
[tasks."test:db"]
description = "Run the server tests against a freshly created test database"
run = '''
set -eu
if [ -z "${TEST_DATABASE_URL:-}" ]; then
  mise daemons start postgres
  dropdb --if-exists --force sequoia_test
  createdb sequoia_test
  TEST_DATABASE_URL="postgresql://$PGUSER@$PGHOST:$PGPORT/sequoia_test"
fi
TEST_DATABASE_URL="$TEST_DATABASE_URL" cargo test --locked -p sequoia-server
'''

[tasks."test:tools"]
description = "Test the repository tool: release selection, keys, pages and Compose handling"
run = "cargo test --locked --manifest-path tools/xtask/Cargo.toml"

[tasks.test]
description = "Run every Rust test, the server's against a fresh test database"
run = [
  { task = "test:db" },
  "cargo test --locked --workspace --exclude sequoia-server",
  "cargo test --locked --manifest-path services/sequoia-ingest/Cargo.toml",
  { task = "test:tools" },
]

[tasks.build]
description = "Build both release clients (size-checked) and the release API and gateway"
run = [
  "cargo xtask web --release",
  "cargo build --release --locked -p sequoia-server",
  "cargo build --release --locked --manifest-path services/sequoia-ingest/Cargo.toml",
]

[tasks."release:plan"]
description = "Say what delivering a change needs: a CSS or client release, images or config"
run = "cargo xtask release plan"

[tasks."release:client"]
description = "Build a client release bundle, reusing the base release when only CSS changed"
run = "cargo xtask release client"

[tasks."release:activate"]
description = "Install, activate and check a client release bundle on SEQUOIA_RELEASE_EXEC"
run = "cargo xtask release activate"

[tasks."release:status"]
description = "Show the target's client releases"
run = "cargo xtask release status"

[tasks."release:rollback"]
description = "Activate the target's previous client release"
run = "cargo xtask release rollback"

[tasks."release:services"]
description = "Pull and update only the named service images through SEQUOIA_COMPOSE_EXEC"
run = "cargo xtask release services"

[tasks."coolify:init"]
description = "Initialise ops/coolify against the operator's encrypted state (SEQUOIA_COOLIFY_STATE)"
run = "bash ops/coolify/tofu.sh init"

[tasks."coolify:import"]
description = "Import the production Coolify application: <project>:<server>:production:<application>"
run = "bash ops/coolify/tofu.sh import"

[tasks."coolify:plan"]
description = "Plan ops/coolify into an encrypted saved plan beside the state"
run = "bash ops/coolify/tofu.sh plan"

[tasks."coolify:apply"]
description = "Apply the reviewed saved plan from coolify:plan"
run = "bash ops/coolify/tofu.sh apply"

[tasks."lint:ci"]
description = "Lint the workflows and CI scripts"
run = [
  "actionlint",
  "shellcheck scripts/ci-lane.sh scripts/test-ci-lane.sh",
  "zizmor --offline --no-progress .github/workflows",
]

[tasks."test:ci"]
description = "Test the hosted CI lane selection"
run = "bash scripts/test-ci-lane.sh"

[tasks.ci]
description = "Run the hosted CI checks: formatting, Clippy and the PostgreSQL tests"
run = [
  { task = "fmt:check" },
  { task = "lint" },
  { task = "test:db" },
  { task = "test:tools" },
]

[tasks.verify]
description = "Run every check: formatting, Clippy, all tests, CI selection and the release builds"
run = [
  { task = "lint:ci" },
  { task = "test:ci" },
  { task = "fmt:check" },
  { task = "lint" },
  { task = "test" },
  "cargo xtask web --release",
]
