plugins {
    id 'fabric-loom' version '1.15.4'
}

def targetProfile = providers.gradleProperty("minecraft_profile").get()
if (!(targetProfile ==~ /\d+\.\d+\.\d+/)) {
    throw new GradleException("Invalid Minecraft profile: ${targetProfile}")
}
def profileFile = file("profiles/${targetProfile}.properties")
if (!profileFile.isFile()) {
    throw new GradleException("Unknown Minecraft profile: ${targetProfile}; see profiles/")
}
def profile = new Properties()
profileFile.withInputStream { profile.load(it) }
["minecraft_version", "yarn_mappings", "loader_version", "fabric_version"].each { key ->
    def value = profile.getProperty(key)
    if (!value) {
        throw new GradleException("Missing ${key} in ${profileFile}")
    }
    project.ext.set(key, value)
}

version = "${project.mod_version}+${targetProfile.replace('.', '_')}"
group = project.maven_group

base {
    archivesName = "wynn-iris-mc${project.minecraft_version}"
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

def resourceProperties = [
    version: project.version.toString(),
    minecraft_version: project.minecraft_version.toString()
]

processResources {
    inputs.properties(resourceProperties)
    filesMatching("fabric.mod.json") {
        expand(resourceProperties)
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.compilerArgs.add("-Werror")
}

tasks.named("test").configure {
    useJUnitPlatform()
}
