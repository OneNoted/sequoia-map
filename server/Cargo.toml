[package]
name = "sequoia-server"
edition.workspace = true
version.workspace = true

[[bin]]
name = "sequoia-server"
path = "src/main.rs"

[dependencies]
sequoia-shared = { path = "../shared" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "compression-br", "cors"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
dashmap = "6"
async-stream = "0.3"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
sqlx-core = { version = "0.8", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki", "chrono", "json", "migrate"] }
sqlx-postgres = { version = "0.8", default-features = false, features = ["chrono", "json", "migrate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
thiserror = "2"
# Client releases: file digests, page integrity and the tower service used to serve them.
sha2 = "0.10"
base64 = "0.22"
tower = { version = "0.5", features = ["util"] }
# Command-map image rendering: source tiles decode, resampling, vector drawing, glyph outlines
# and output codecs. libwebp (through `webp`) is the one native dependency; it is used through
# its safe encoder API for compact lossy WebP that Discord displays inline.
fast_image_resize = "6.1"
image-webp = "0.2.4"
png = "0.18.1"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }
webp = { version = "0.3.1", default-features = false }

[dev-dependencies]
temp-env = "0.3"
tempfile = "3"
