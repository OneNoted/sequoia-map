[package]
name = "sequoia-map-engine"
edition.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Gates the wasm-bindgen facade. Off for the Leptos consumers during migration.
js-api = []

[dependencies]
sequoia-shared = { path = "../shared" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "24.0", default-features = false, features = ["wgsl", "webgl"] }
bytemuck = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
futures = "0.3"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "Document",
    "DomRect",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlImageElement",
    "Navigator",
    "TextMetrics",
    "Window",
] }
console_error_panic_hook = "0.1"
